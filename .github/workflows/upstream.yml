name: upstream

# Poll jdx/hk for a new release, run the bump entrypoint, branch, and open a PR.
on:
  schedule:
    - cron: "20 6 * * *"
  workflow_dispatch:

concurrency:
  group: upstream
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      # Read-only: nothing built here is pushed to cachix.
      - uses: cachix/cachix-action@v16
        with:
          name: pr0d1r2
          skipPush: true

      - name: Run upstream bump entrypoint
        id: bump
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          output=$(nix run .#bump 2>&1)
          code=$?
          set -e
          echo "$output"
          
          if [ $code -eq 0 ]; then
            version=$(echo "$output" | grep '^NEW_VERSION=' | cut -d= -f2 || true)
            if [ -n "$version" ]; then
              echo "new_version=$version" >> "$GITHUB_OUTPUT"
              echo "BUMPED=true" >> "$GITHUB_OUTPUT"
            else
              echo "BUMPED=false"
            fi
          elif [ $code -eq 3 ]; then
            echo "Already current."
            echo "BUMPED=false"
          else
            echo "Bump script failed with exit code $code"
            exit $code
          fi

      - name: Create Pull Request
        if: steps.bump.outputs.BUMPED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.bump.outputs.new_version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          branch="upstream/hk-$V"
          if gh pr view "$branch" &>/dev/null; then
            echo "PR for $branch already exists."
            exit 0
          fi

          git checkout -b "$branch"
          git add pkgs/hk/package.nix
          git commit -m "hk: bump to $V"
          git push origin "$branch"
          
          gh pr create \
            --title "hk: bump to $V" \
            --body "Automated bump to upstream v$V" \
            --head "$branch" \
            --base main
