name: upstream

# Poll jdx/hk for a new release and prove it builds here, hashes resolved.
# Detection only: the job goes red when a newer hk exists (or fails to build),
# and a person or the loop makes the bump. No workflow in this repository
# pushes a branch or opens a PR (§C). Pull model on purpose: no cross-repo
# token, nothing upstream needs to know we exist.
on:
  schedule:
    - cron: "20 6 * * *"
  workflow_dispatch:

concurrency:
  group: upstream
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bump:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      # Read-only: nothing built here is pushed.
      - uses: cachix/cachix-action@v16
        with:
          name: pr0d1r2
          skipPush: true

      # `shell: bash` runs with pipefail; the default `bash -e {0}` does not, so
      # a failed bump (a build that does not pass) exited with tee's 0, the job
      # went green and nothing was reported (B8).
      - name: Bump to latest upstream tag
        id: bump
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/bump-hk.sh | tee -a "$GITHUB_OUTPUT"

      # Red, not a PR: the bump is made by hand or by the loop, where review
      # happens. The message says exactly what to run.
      - name: Report a newer hk
        if: steps.bump.outputs.NEW_VERSION != ''
        env:
          V: ${{ steps.bump.outputs.NEW_VERSION }}
        run: |
          echo "::error::hk $V is released and builds here; bump with scripts/bump-hk.sh, then update README.md and SPEC.md §G"
          exit 1
